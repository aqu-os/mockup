[package]
name = "aquos-mockup"
version = "0.1.0"
edition = "2021"
authors = ["Marcel Lambert <marcel_lambert@ymail.com>"]
description = "UI mockup / prototyping playground for the Aquos desktop."
publish = false

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "PointerEvent",
    "DomRect",
    "HtmlElement",
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "Event",
    "KeyboardEvent",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
